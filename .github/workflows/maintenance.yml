name: upstream maintenance

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  references:
    name: upstream references (${{ matrix.profile }}, ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: locked, python: "3.12"}
          - {profile: current, python: "3.12"}
          - {profile: current, python: "3.13"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Compare installed code with existing numerical references
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET_PYTHON: ${{ matrix.python }}
        run: >-
          uv run --frozen --group build python validation/maintenance.py
          --profile "$PROFILE" --python "$TARGET_PYTHON" --output .work/maintenance
      - name: Retain controlled evidence for Josh Myers's maintenance triage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-${{ matrix.profile }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/maintenance/result.json
            .work/maintenance/stages.jsonl
          retention-days: 90
          if-no-files-found: error
