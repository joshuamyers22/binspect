name: artifact qualification

on:
  workflow_call:
    inputs:
      expected-tag:
        type: string
        default: ""
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      manifest-sha256:
        value: ${{ jobs.build.outputs.manifest-sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.build.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - name: Exercise tag acceptance and rejection
        run: uv run --frozen --extra dev pytest tests/test_artifacts.py
      - name: Build and inspect one locked distribution pair
        id: build
        env:
          EXPECTED_TAG: ${{ inputs.expected-tag }}
        run: >-
          uv run --frozen --group build python validation/artifacts.py build
          --bundle .work/artifact-bundle --expected-tag "$EXPECTED_TAG"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: qualified-distributions
          path: .work/artifact-bundle/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        profile: [native]
        include:
          - {os: ubuntu-latest, python: "3.12", profile: pandas}
          - {os: ubuntu-latest, python: "3.12", profile: dpi}
          - {os: macos-latest, python: "3.12", profile: pandas}
          - {os: macos-latest, python: "3.12", profile: dpi}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify handoff and install each artifact outside checkout
        env:
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          TARGET_PYTHON: ${{ matrix.python }}
          PROFILE: ${{ matrix.profile }}
        run: >-
          uv run --frozen --group build python validation/artifacts.py install
          --bundle .work/artifact-bundle --manifest-sha256 "$MANIFEST_SHA256"
          --python "$TARGET_PYTHON" --profile "$PROFILE"
          --output .work/artifact-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-install-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.profile }}
          path: .work/artifact-result.json
          if-no-files-found: error
