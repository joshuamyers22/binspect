name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  artifacts:
    uses: ./.github/workflows/artifacts.yml
    with:
      expected-tag: ${{ github.event.release.tag_name }}

  audit:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify handoff before auditing exact distributions
        env:
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/artifacts.py verify --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
      - name: Audit qualified distributions
        run: >-
          uv run --frozen --all-extras --all-groups python validation/supply_chain.py
          --artifacts .work/artifact-bundle/dist
      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            .work/supply-chain/result.json
            .work/supply-chain/licenses.json
            .work/supply-chain/sbom.cdx.json
          if-no-files-found: error

  provenance:
    needs: [artifacts, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify the qualified handoff before signing
        env:
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/artifacts.py verify --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
      - name: Attest the qualified distribution pair
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .work/artifact-bundle/dist/*
          create-storage-record: false
      - name: Retain the signed bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p .work/provenance
          cp "$ATTESTATION_BUNDLE" .work/provenance/attestation.json
      - name: Verify signatures and exact release identity
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/provenance.py --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
          --attestation .work/provenance/attestation.json
          --source "$GITHUB_SHA" --ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          > .work/provenance/result.json
      - name: Retain authenticated provenance
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: .work/provenance/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [artifacts, audit, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/binspect-regression/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify the qualified handoff again before publication
        env:
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/artifacts.py verify --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.provenance.outputs.artifact-id }}
          merge-multiple: true
          path: .work/provenance/
      - name: Independently verify signed provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/provenance.py --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
          --attestation .work/provenance/attestation.json
          --source "$GITHUB_SHA" --ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: .work/artifact-bundle/dist/
