name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  artifacts:
    uses: ./.github/workflows/artifacts.yml
    with:
      expected-tag: ${{ github.event.release.tag_name }}

  audit:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify handoff before auditing exact distributions
        env:
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/artifacts.py verify --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
      - name: Audit qualified distributions
        run: >-
          uv run --frozen --all-extras --all-groups python validation/supply_chain.py
          --artifacts .work/artifact-bundle/dist
      - name: Retain supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: supply-chain-evidence
          path: |
            .work/supply-chain/result.json
            .work/supply-chain/licenses.json
            .work/supply-chain/sbom.cdx.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [artifacts, audit]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/binspect-regression/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: .work/artifact-bundle/
      - name: Verify the qualified handoff again before publication
        env:
          MANIFEST_SHA256: ${{ needs.artifacts.outputs.manifest-sha256 }}
        run: >-
          python validation/artifacts.py verify --bundle .work/artifact-bundle
          --manifest-sha256 "$MANIFEST_SHA256"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: .work/artifact-bundle/dist/
